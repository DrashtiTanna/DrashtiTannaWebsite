<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Explore in 3D — Beyond the Boundaries</title>
<meta name="description" content="Interactive 3D model of the Beyond the Boundaries proposal — walk the infraspace corridor between the BreBeMi motorway and the railway at Romano di Lombardia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M10 55 Q30 35 50 55 T90 55 L90 75 Q70 95 50 75 T10 75 Z' fill='%231d4e6e'/></svg>">
<style>
  :root {
    --paper: #f4f0ed; --blue: #1d4e6e; --blue-dark: #143850;
    --ink: #171b1e; --grey: #6f6a68;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --sans: 'Space Grotesk', 'Segoe UI', Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: var(--sans); background: var(--ink); color: var(--paper); }
  #scene { position: fixed; inset: 0; display: block; touch-action: none; }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 16px; pointer-events: none; gap: 10px;
  }
  .topbar > * { pointer-events: auto; }
  .back {
    font-family: var(--mono); font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: #fff; text-decoration: none;
    background: rgba(18,22,25,.75); padding: 10px 16px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.15);
  }
  .back:hover { background: var(--blue); }
  .title-chip {
    font-family: var(--mono); font-size: 11px; letter-spacing: .18em;
    text-transform: uppercase; color: rgba(255,255,255,.85);
    background: rgba(18,22,25,.75); padding: 10px 16px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.15);
    display: none;
  }
  @media (min-width: 700px) { .title-chip { display: block; } }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .ctl {
    font-family: var(--mono); font-size: 12px; letter-spacing: .1em;
    text-transform: uppercase; color: #fff; cursor: pointer;
    background: rgba(18,22,25,.75); padding: 10px 14px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.15); transition: background .2s;
  }
  .ctl:hover { background: rgba(45,60,70,.85); }
  .ctl.active { background: var(--blue); border-color: var(--blue); }

  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 20; font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em;
    color: rgba(255,255,255,.9); background: rgba(18,22,25,.75);
    padding: 9px 18px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.15); text-align: center;
    max-width: 92vw; pointer-events: none;
  }

  #infoCard {
    position: fixed; left: 16px; bottom: 56px; z-index: 25;
    width: min(330px, calc(100vw - 32px));
    background: rgba(244,240,237,.97); color: #1d1a19;
    border-top: 4px solid var(--blue);
    padding: 18px 20px; display: none;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }
  #infoCard.open { display: block; }
  #infoCard .num { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--blue); text-transform: uppercase; }
  #infoCard h3 { font-size: 19px; margin: 4px 0 6px; }
  #infoCard p { font-size: 13.5px; line-height: 1.55; color: #444; }
  #infoClose {
    position: absolute; top: 8px; right: 10px; border: 0; background: none;
    font-size: 20px; cursor: pointer; color: var(--grey); line-height: 1;
  }

  #crosshair {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    z-index: 15; width: 14px; height: 14px; display: none; pointer-events: none;
  }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,.85); }
  #crosshair::before { left: 6px; top: 0; width: 2px; height: 14px; }
  #crosshair::after  { top: 6px; left: 0; width: 14px; height: 2px; }

  #walkStart {
    position: fixed; inset: 0; z-index: 40; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(18,22,25,.84); text-align: center; padding: 24px;
  }
  #walkStart.open { display: flex; }
  #walkStart h2 { text-transform: uppercase; letter-spacing: .04em; font-size: clamp(22px, 4vw, 34px); }
  #walkStart .river-ico { width: 84px; height: 26px; margin-bottom: 22px; }
  #walkStart p { font-family: var(--mono); font-size: 12.5px; letter-spacing: .08em; color: #c9d2d8; margin: 14px 0 26px; line-height: 2; }
  #walkStart button {
    font-family: var(--mono); font-size: 14px; letter-spacing: .16em; text-transform: uppercase;
    background: var(--blue); border: 0; color: #fff; padding: 15px 38px; cursor: pointer;
  }
  #walkStart button:hover { background: var(--blue-dark); }

  #loading {
    position: fixed; inset: 0; z-index: 50; background: var(--ink);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    transition: opacity .6s;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .river-ico { width: 110px; height: 34px; animation: drift 2s ease-in-out infinite; }
  @keyframes drift { 50% { transform: translateX(10px); opacity: .75; } }
  #loading p { margin-top: 20px; font-family: var(--mono); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #8d979e; }

  #joy {
    position: fixed; z-index: 30; width: 110px; height: 110px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.06);
    display: none; pointer-events: none;
  }
  #joyKnob {
    position: absolute; left: 50%; top: 50%; width: 46px; height: 46px;
    border-radius: 50%; background: rgba(29,78,110,.9);
    transform: translate(-50%,-50%);
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="topbar">
  <a class="back" href="index.html">&#8592; Project</a>
  <div class="title-chip">Beyond the Boundaries &middot; Romano di Lombardia &middot; 3D corridor</div>
  <div class="controls">
    <button class="ctl active" id="btnOrbit">&#10227; Orbit</button>
    <button class="ctl" id="btnWalk">&#128694; Walk</button>
    <button class="ctl" id="btnNight">&#9789; Night</button>
    <button class="ctl active" id="btnLabels">&#9679; Labels</button>
  </div>
</div>

<div id="hint">drag to orbit &middot; scroll to zoom &middot; click a blue marker for info</div>

<div id="infoCard">
  <button id="infoClose">&times;</button>
  <div class="num" id="infoNum"></div>
  <h3 id="infoName"></h3>
  <p id="infoDesc"></p>
</div>

<div id="crosshair"></div>

<div id="walkStart">
  <svg class="river-ico" viewBox="0 0 110 34"><path d="M0 17 Q14 4 28 17 T56 17 T84 17 T112 17" fill="none" stroke="#1d4e6e" stroke-width="6"/></svg>
  <h2>First-person visit</h2>
  <p id="walkHelp"></p>
  <button id="walkGo">Start walking</button>
</div>

<div id="loading">
  <svg class="river-ico" viewBox="0 0 110 34"><path d="M0 17 Q14 4 28 17 T56 17 T84 17 T112 17" fill="none" stroke="#1d4e6e" stroke-width="6"/></svg>
  <p>Growing the corridor&hellip;</p>
</div>

<div id="joy"><div id="joyKnob"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   BEYOND THE BOUNDARIES — interactive 3D corridor
   Stylised model of the intervention at Romano di Lombardia:
   the infraspace between the BreBeMi motorway and the railway,
   the Serio River, bioswales, detention ponds, fontanili and
   reforestation. North = -Z.
   ============================================================ */

const COL = {
  blue: 0x1d4e6e, water: 0x27506c, waterDark: 0x16324a,
  sky: 0xdfe7ec, skyNight: 0x10141c,
  grass: 0x9db07a, meadow: 0xaebd8a,
  fieldA: 0xc9c19a, fieldB: 0xa8b578, fieldC: 0xb5c490, fieldD: 0xd5cba4,
  asphalt: 0x3a3d40, ballast: 0x6f6a64, gravel: 0xd8d2c4,
  concrete: 0xb4aea8, embank: 0x8f9678,
  leafA: 0x5c7345, leafB: 0x74885a, leafC: 0x46603a, willow: 0x7d9468,
  trunk: 0x6e5a44, reed: 0x8a9a5b,
  red: 0xa33327, warm: 0xffd9a0
};

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* ---------- renderer / scene / camera ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.sky);
scene.fog = new THREE.Fog(COL.sky, 130, 380);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.3, 700);
camera.position.set(85, 62, 105);

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xf4f7f8, 0x7d8570, 1.1);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xfff3e0, 2.4);
sunLight.position.set(70, 90, -50);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -130; sunLight.shadow.camera.right = 130;
sunLight.shadow.camera.top = 130; sunLight.shadow.camera.bottom = -130;
sunLight.shadow.camera.far = 320;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

/* ---------- materials ---------- */
const M = {
  grass: new THREE.MeshStandardMaterial({ color: COL.grass, roughness: 1 }),
  meadow: new THREE.MeshStandardMaterial({ color: COL.meadow, roughness: 1 }),
  water: new THREE.MeshStandardMaterial({ color: COL.water, roughness: .3, metalness: .05 }),
  canal: new THREE.MeshStandardMaterial({ color: COL.blue, roughness: .35 }),
  asphalt: new THREE.MeshStandardMaterial({ color: COL.asphalt, roughness: .9 }),
  ballast: new THREE.MeshStandardMaterial({ color: COL.ballast, roughness: 1 }),
  gravel: new THREE.MeshStandardMaterial({ color: COL.gravel, roughness: 1 }),
  concrete: new THREE.MeshStandardMaterial({ color: COL.concrete, roughness: .9 }),
  embank: new THREE.MeshStandardMaterial({ color: COL.embank, roughness: 1 }),
  white: new THREE.MeshStandardMaterial({ color: 0xeeeae4, roughness: .7 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x26292c, roughness: .8 }),
  rail: new THREE.MeshStandardMaterial({ color: 0x555a5e, roughness: .5, metalness: .5 }),
  trunk: new THREE.MeshStandardMaterial({ color: COL.trunk, roughness: 1 }),
  leafA: new THREE.MeshStandardMaterial({ color: COL.leafA, roughness: 1 }),
  leafB: new THREE.MeshStandardMaterial({ color: COL.leafB, roughness: 1 }),
  leafC: new THREE.MeshStandardMaterial({ color: COL.leafC, roughness: 1 }),
  willow: new THREE.MeshStandardMaterial({ color: COL.willow, roughness: 1 }),
  reed: new THREE.MeshStandardMaterial({ color: COL.reed, roughness: 1 }),
  red: new THREE.MeshStandardMaterial({ color: COL.red, roughness: .6 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x51606a, roughness: .3, metalness: .3 })
};

/* ---------- helpers ---------- */
function box(w, h, d, mat, x, y, z, ry = 0, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  return m;
}
function cyl(rT, rB, h, mat, x, y, z, seg = 10) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rT, rB, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function flat(w, d, mat, x, y, z, ry = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI / 2;
  m.rotation.z = ry;
  m.position.set(x, y, z);
  m.receiveShadow = true;
  return m;
}

const world = new THREE.Group();
scene.add(world);
const colliders = [];   // ground-level AABBs

/* ---------- ground + fields ---------- */
world.add(flat(520, 400, M.grass, 0, -0.02, 0));

// field patchwork north of the motorway and south of the railway
const fieldMats = [M.meadow,
  new THREE.MeshStandardMaterial({ color: COL.fieldA, roughness: 1 }),
  new THREE.MeshStandardMaterial({ color: COL.fieldB, roughness: 1 }),
  new THREE.MeshStandardMaterial({ color: COL.fieldC, roughness: 1 }),
  new THREE.MeshStandardMaterial({ color: COL.fieldD, roughness: 1 })];
let fi = 0;
for (let x = -220; x < 240; x += 76) {
  for (const z of [-58, -110, 58, 104]) {
    world.add(flat(68, 42, fieldMats[fi++ % 5], x + (z > 0 ? 18 : 0), 0.06, z));
  }
}

// irrigation canals crossing the fields (N-S)
[-130, -76, 64, 128].forEach(x => {
  world.add(flat(2.2, 130, M.canal, x, 0.16, -95));
  world.add(flat(2.2, 110, M.canal, x + 8, 0.16, 90));
});
// Fosso Bergamasco — historic canal, south fields
world.add(flat(460, 3.4, M.canal, 0, 0.16, 66));

// distant ridge to the north (the pre-Alps)
[[-150, -300, 130, 26], [40, -320, 150, 30], [200, -290, 120, 22]].forEach(([x, z, r, h]) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0x9aa5ab, roughness: 1 }));
  m.scale.y = h / r;
  m.position.set(x, -0.5, z);
  world.add(m);
});

/* ---------- Serio River (meandering, N-S) ---------- */
const RIVER_PTS = [[-28, -95], [-14, -52], [-22, -18], [-19, 12], [-15, 46], [-24, 95]];
for (let i = 0; i < RIVER_PTS.length - 1; i++) {
  const [x1, z1] = RIVER_PTS[i], [x2, z2] = RIVER_PTS[i + 1];
  const len = Math.hypot(x2 - x1, z2 - z1) + 6;
  const ang = Math.atan2(x2 - x1, z2 - z1);
  const seg = flat(10, len, M.water, (x1 + x2) / 2, 0.15, (z1 + z2) / 2, -ang);
  world.add(seg);
  // gravel banks
  world.add(flat(14, len, M.gravel, (x1 + x2) / 2, 0.10, (z1 + z2) / 2, -ang));
  // collider strip (approximate)
  const midX = (x1 + x2) / 2;
  colliders.push({ minX: midX - 5.5, maxX: midX + 5.5, minZ: Math.min(z1, z2), maxZ: Math.max(z1, z2), tag: 'river' });
}

/* ---------- BreBeMi motorway (E-W at z=-18, surface y=5) ---------- */
const ROAD_Y = 5;
const GAP = { minX: -35, maxX: -5 };   // bridge span over the river + passage

function embankment(minX, maxX, zC, widthTop, height, mat) {
  const w = maxX - minX;
  const g = new THREE.Group();
  g.add(box(w, height, widthTop, mat, (minX + maxX) / 2, height / 2, zC));
  // sloped sides
  const slope = new THREE.Mesh(new THREE.PlaneGeometry(w, height * 2.2), mat);
  slope.position.set((minX + maxX) / 2, height / 2, zC + widthTop / 2 + height * 0.55);
  slope.rotation.x = -Math.PI / 2 + Math.atan2(height, height * 1.1);
  slope.receiveShadow = true;
  g.add(slope);
  const slope2 = slope.clone();
  slope2.position.z = zC - widthTop / 2 - height * 0.55;
  slope2.rotation.x = Math.PI / 2 - Math.atan2(height, height * 1.1);
  g.add(slope2);
  world.add(g);
}

// west + east embankment segments (gap over the river)
embankment(-240, GAP.minX, -18, 10, 4.7, M.embank);
embankment(GAP.maxX, 240, -18, 10, 4.7, M.embank);
// road slab full length (bridge deck across the gap)
world.add(box(480, 0.5, 9, M.asphalt, 0, ROAD_Y - 0.25, -18));
// centre line dashes
for (let x = -236; x < 240; x += 14) world.add(box(4, 0.06, 0.25, M.white, x, ROAD_Y + 0.04, -18, 0, false));
// guard rails
world.add(box(480, 0.35, 0.12, M.concrete, 0, ROAD_Y + 0.4, -22.6, 0, false));
world.add(box(480, 0.35, 0.12, M.concrete, 0, ROAD_Y + 0.4, -13.4, 0, false));
// bridge piers at the gap
[[-30, -18], [-10, -18]].forEach(([x, z]) => {
  world.add(cyl(1.1, 1.3, ROAD_Y - 0.5, M.concrete, x, (ROAD_Y - 0.5) / 2, z, 12));
  colliders.push({ minX: x - 1.4, maxX: x + 1.4, minZ: z - 1.4, maxZ: z + 1.4 });
});
// motorway colliders (ground level), leaving the gap + the viewpoint ramp strip free
colliders.push({ minX: -240, maxX: GAP.minX, minZ: -25, maxZ: -11 });
colliders.push({ minX: GAP.maxX, maxX: 240, minZ: -25, maxZ: -13.6 });
colliders.push({ minX: GAP.maxX, maxX: 40, minZ: -13.6, maxZ: -11 });
colliders.push({ minX: 70, maxX: 240, minZ: -13.6, maxZ: -11 });

// street light poles
for (let x = -220; x <= 220; x += 44) {
  world.add(cyl(0.09, 0.09, 6, M.dark, x, ROAD_Y + 3, -22.2, 6));
  world.add(box(1.6, 0.09, 0.09, M.dark, x + 0.7, ROAD_Y + 6, -22.2, 0, false));
}

/* ---------- railway (E-W at z=26, surface y=2.5) ---------- */
const RAIL_Y = 2.5;
embankment(-240, GAP.minX, 26, 7, 2.2, M.ballast);
embankment(GAP.maxX, 240, 26, 7, 2.2, M.ballast);
world.add(box(480, 0.3, 5.4, M.ballast, 0, RAIL_Y - 0.35, 26));
// rails
world.add(box(480, 0.12, 0.14, M.rail, 0, RAIL_Y - 0.1, 25.2, 0, false));
world.add(box(480, 0.12, 0.14, M.rail, 0, RAIL_Y - 0.1, 26.8, 0, false));
// sleepers
for (let x = -238; x < 240; x += 4) world.add(box(0.5, 0.08, 2.4, M.dark, x, RAIL_Y - 0.18, 26, 0, false));
// rail bridge piers
[[-28, 26], [-12, 26]].forEach(([x, z]) => {
  world.add(cyl(0.8, 1.0, RAIL_Y - 0.4, M.concrete, x, (RAIL_Y - 0.4) / 2, z, 12));
  colliders.push({ minX: x - 1.1, maxX: x + 1.1, minZ: z - 1.1, maxZ: z + 1.1 });
});
colliders.push({ minX: -240, maxX: GAP.minX, minZ: 22.5, maxZ: 29.5 });
colliders.push({ minX: GAP.maxX, maxX: 240, minZ: 22.5, maxZ: 29.5 });

/* ---------- viewpoint ramp onto the BreBeMi shoulder ---------- */
const RAMPB = { minX: 40, maxX: 70, minZ: -13.6, maxZ: -11.0, hTop: ROAD_Y };
const VIEW = { minX: 68, maxX: 84, minZ: -14.6, maxZ: -12.8, h: ROAD_Y };

(function buildRamp() {
  const len = RAMPB.maxX - RAMPB.minX;
  const ramp = new THREE.Mesh(new THREE.BoxGeometry(len, 0.3, RAMPB.maxZ - RAMPB.minZ), M.gravel);
  ramp.castShadow = ramp.receiveShadow = true;
  ramp.position.set((RAMPB.minX + RAMPB.maxX) / 2, RAMPB.hTop / 2, (RAMPB.minZ + RAMPB.maxZ) / 2);
  ramp.rotation.z = Math.atan2(RAMPB.hTop, len);   // rises toward +x
  world.add(ramp);
  // viewpoint deck + red railing (the "perception from BreBeMi")
  world.add(box(VIEW.maxX - VIEW.minX, 0.35, VIEW.maxZ - VIEW.minZ, M.gravel, (VIEW.minX + VIEW.maxX) / 2, VIEW.h - 0.17, (VIEW.minZ + VIEW.maxZ) / 2));
  const railMat = M.red;
  world.add(box(VIEW.maxX - VIEW.minX, 0.08, 0.08, railMat, (VIEW.minX + VIEW.maxX) / 2, VIEW.h + 1.05, VIEW.maxZ, 0, false));
  world.add(box(VIEW.maxX - VIEW.minX, 0.08, 0.08, railMat, (VIEW.minX + VIEW.maxX) / 2, VIEW.h + 1.05, VIEW.minZ, 0, false));
  world.add(box(0.08, 0.08, VIEW.maxZ - VIEW.minZ, railMat, VIEW.maxX, VIEW.h + 1.05, (VIEW.minZ + VIEW.maxZ) / 2, 0, false));
  for (let x = VIEW.minX; x <= VIEW.maxX; x += 4) {
    world.add(cyl(0.04, 0.04, 1.05, railMat, x, VIEW.h + 0.5, VIEW.maxZ, 6));
    world.add(cyl(0.04, 0.04, 1.05, railMat, x, VIEW.h + 0.5, VIEW.minZ, 6));
  }
})();

/* ---------- the corridor: path, bioswales, ponds ---------- */

// proposed gravel path through the corridor to the river
world.add(flat(160, 3.6, M.gravel, 40, 0.20, 4));
// riverside path passing under both bridges (east bank of the Serio)
world.add(flat(3.2, 130, M.gravel, -10.5, 0.20, -20));

// bioswale canals: from the motorway edge to the detention pond
[[28, -4, 0.5], [56, -2, -0.45]].forEach(([x, z, ry]) => {
  world.add(flat(2.4, 16, M.canal, x, 0.22, z, ry));
  // fringe shrubs
  for (let i = -3; i <= 3; i++) {
    const s = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5 + Math.random() * 0.3, 1), M.reed);

function makeMarkerTexture(text) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(29,78,110,0.95)';
  const w = 240, h = 92, r = 16;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect((256 - w) / 2, (128 - h) / 2, w, h, r);
  else ctx.rect((256 - w) / 2, (128 - h) / 2, w, h);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '600 40px "IBM Plex Mono", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 66);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

let mode = 'orbit';

let yaw = 0, pitch = 0;
const keys = {};

function groundHeight(x, z) {
  if (x >= RAMPB.minX && x <= RAMPB.maxX && z >= RAMPB.minZ && z <= RAMPB.maxZ) {
    const t = (x - RAMPB.minX) / (RAMPB.maxX - RAMPB.minX);
    return RAMPB.hTop * t;
  }
  if (x >= VIEW.minX && x <= VIEW.maxX && z >= VIEW.minZ && z <= VIEW.maxZ) return VIEW.h;
  return 0;
}

function blockedAt(x, z, curY) {
  if (curY > 2.5) return false;
  for (const c of colliders) {
    if (x > c.minX && x < c.maxX && z > c.minZ && z < c.maxZ) return true;
  }
  return false;
}

function lockPointer() { canvas.requestPointerLock?.(); }
document.addEventListener('mousemove', e => {
  if (mode !== 'walk' || document.pointerLockElement !== canvas) return;
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-1.25, Math.min(1.25, pitch));
});
document.addEventListener('pointerlockchange', () => {
  if (mode === 'walk' && document.pointerLockElement !== canvas && !isTouch) setMode('orbit');
});
document.addEventListener('keydown', e => { keys[e.code] = true; });
document.addEventListener('keyup', e => { keys[e.code] = false; });

const joy = document.getElementById('joy');
const joyKnob = document.getElementById('joyKnob');
let joyId = null, joyCenter = { x: 0, y: 0 };
let lookId = null, lookLast = { x: 0, y: 0 };

canvas.addEventListener('touchstart', e => {
  if (mode !== 'walk') return;
  for (const t of e.changedTouches) {
    if (t.clientX < window.innerWidth * 0.45 && joyId === null) {
      joyId = t.identifier;
      joyCenter = { x: t.clientX, y: t.clientY };
      joy.style.display = 'block';
      joy.style.left = (t.clientX - 55) + 'px';
      joy.style.top = (t.clientY - 55) + 'px';
    } else if (lookId === null) {
      lookId = t.identifier;
      lookLast = { x: t.clientX, y: t.clientY };
    }
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if (mode !== 'walk') return;
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      const dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
      const len = Math.hypot(dx, dy), max = 45;
      const cl = Math.min(len, max);
      const nx = len ? dx / len : 0, ny = len ? dy / len : 0;
      joyVec = { x: nx * (cl / max), y: ny * (cl / max) };
      joyKnob.style.transform = `translate(calc(-50% + ${nx * cl}px), calc(-50% + ${ny * cl}px))`;
    } else if (t.identifier === lookId) {
      yaw -= (t.clientX - lookLast.x) * 0.005;
      pitch -= (t.clientY - lookLast.y) * 0.005;
      pitch = Math.max(-1.25, Math.min(1.25, pitch));
      lookLast = { x: t.clientX, y: t.clientY };
    }
  }
}, { passive: true });

canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      joyId = null; joyVec = { x: 0, y: 0 };
      joy.style.display = 'none';
      joyKnob.style.transform = 'translate(-50%,-50%)';
    }
    if (t.identifier === lookId) lookId = null;
  }
});

/* ---------- picking ---------- */
const raycaster = new THREE.Raycaster();
const infoCard = document.getElementById('infoCard');

function showFacility(f) {
  document.getElementById('infoNum').textContent = f.num;
  document.getElementById('infoName').textContent = f.name;
  document.getElementById('infoDesc').textContent = f.desc;
  infoCard.classList.add('open');
}
document.getElementById('infoClose').addEventListener('click', () => infoCard.classList.remove('open'));

function pick(ndcX, ndcY) {
  raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);
  const hits = raycaster.intersectObjects(markers, false);
  if (hits.length) { showFacility(hits[0].object.userData.facility); return true; }
  return false;
}

canvas.addEventListener('click', e => {
  if (!markerGroup.visible) return;
  if (mode === 'walk' && !isTouch) {
    if (document.pointerLockElement === canvas) pick(0, 0);
    else lockPointer();
    return;
  }
  pick((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
});

/* ---------- animation loop ---------- */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // traffic
  cars.forEach(c => {
    c.g.position.x += c.dir * c.speed * dt;
    if (c.g.position.x > 230) c.g.position.x = -230;
    if (c.g.position.x < -230) c.g.position.x = 230;
  });
  trainX += 26 * dt;
  if (trainX > 240) trainX = -270;
  train.position.x = trainX;

  // marker bobbing
  markers.forEach((m, i) => { m.position.y = m.userData.baseY + Math.sin(t * 1.6 + i) * 0.16; });

  if (mode === 'orbit') {
    orbit.update();
  } else {
    const speed = (keys.ShiftLeft || keys.ShiftRight) ? 10.5 : 5.0;
    let fwd = 0, strafe = 0;
    if (keys.KeyW || keys.ArrowUp) fwd += 1;
    if (keys.KeyS || keys.ArrowDown) fwd -= 1;
    if (keys.KeyA || keys.ArrowLeft) strafe -= 1;
    if (keys.KeyD || keys.ArrowRight) strafe += 1;
    fwd += -joyVec.y; strafe += joyVec.x;

    const len = Math.hypot(fwd, strafe);
    if (len > 1) { fwd /= len; strafe /= len; }

    const sin = Math.sin(yaw), cos = Math.cos(yaw);
    velocity.x = (-sin * fwd + cos * strafe) * speed;
    velocity.z = (-cos * fwd - sin * strafe) * speed;

    const curFeet = playerPos.y - EYE;
    let nx = playerPos.x + velocity.x * dt;
    let nz = playerPos.z + velocity.z * dt;

    if (blockedAt(nx, playerPos.z, curFeet)) nx = playerPos.x;
    if (blockedAt(nx, nz, curFeet)) nz = playerPos.z;

    nx = Math.max(-150, Math.min(150, nx));
    nz = Math.max(-90, Math.min(80, nz));

    const newGround = groundHeight(nx, nz);
    if (curFeet > 2.5 && newGround < 0.5 && curFeet - newGround > 2.5) {
      nx = playerPos.x; nz = playerPos.z;
    } else {
      playerPos.x = nx; playerPos.z = nz;
    }

    const targetY = groundHeight(playerPos.x, playerPos.z) + EYE;
    playerPos.y += (targetY - playerPos.y) * Math.min(1, dt * 10);

    camera.position.copy(playerPos);
    camera.rotation.set(0, 0, 0);
    camera.rotateY(yaw);
    camera.rotateX(pitch);
    if (len > 0.1) camera.position.y += Math.sin(t * 9) * 0.045;
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
requestAnimationFrame(() => document.getElementById('loading').classList.add('done'));
